services:
  - type: web
    name: blockaccred-api
    runtime: docker
    region: oregon
    plan: 0.5c-512mb
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: blockaccred-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://blockaccred.onrender.com
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: BLOCKCHAIN_NETWORK
        value: Sepolia
      - key: BLOCKCHAIN_RPC_URL
        sync: false
      - key: BLOCKCHAIN_PRIVATE_KEY
        sync: false
      - key: CONTRACT_ADDRESS
        sync: false
    disk:
      name: evidence-uploads
      mountPath: /var/data
      sizeGB: 1

  - type: web
    name: blockaccred
    runtime: static
    buildCommand: npm ci --prefix frontend && npm run build --prefix frontend
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://blockaccred-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: blockaccred-db
    databaseName: blockaccred
    user: blockaccred
    region: oregon
    plan: 0.1c-256mb
    postgresMajorVersion: "16"
